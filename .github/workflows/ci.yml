name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The overlay is stringified into a real page, which is the most
      # breakable thing here, so those tests need an actual browser.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg webp

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Format
        run: pnpm format:check

      - name: Skill is in sync with its generator
        run: pnpm build:skill --check

      - name: README command reference is in sync with the flags
        run: pnpm build:reference --check

      - name: CLI answers from the built output
        run: |
          test "$(node dist/bin/screencast-axi.js --version)" = "$(node -p "require('./package.json').version")"
          node dist/bin/screencast-axi.js | grep -q "0 scenarios"
